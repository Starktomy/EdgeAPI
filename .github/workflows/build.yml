name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/EdgeAPI
    env:
      GOTOOLCHAIN: local
      GOWORK: off
      GOFLAGS: '-mod=readonly'
    strategy:
      matrix:
        goarch: [amd64, arm64]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: EdgeAPI
        persist-credentials: false

    - name: Require pinned sibling source revisions
      env:
        EDGE_COMMON_REF: ${{ vars.EDGE_COMMON_REF }}
        EDGE_NODE_REF: ${{ vars.EDGE_NODE_REF }}
      run: |
        for name in EDGE_COMMON_REF EDGE_NODE_REF; do
          if [[ ! "${!name}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Set $name to the published matching sibling commit (40 hexadecimal characters)."
            exit 1
          fi
        done

    - name: Checkout EdgeCommon
      uses: actions/checkout@v4
      with:
        repository: Starktomy/EdgeCommon
        ref: ${{ vars.EDGE_COMMON_REF }}
        path: EdgeCommon
        persist-credentials: false

    - name: Checkout EdgeNode
      uses: actions/checkout@v4
      with:
        repository: Starktomy/EdgeNode
        ref: ${{ vars.EDGE_NODE_REF }}
        path: EdgeNode
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.27.4'
        cache-dependency-path: |
          EdgeAPI/go.sum
          EdgeCommon/go.sum

    - name: Install CGO cross compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc gcc-aarch64-linux-gnu

    - name: Download dependencies
      run: go mod download

    - name: Verify module checksums
      run: go mod verify

    - name: Install pinned vulnerability scanner
      if: matrix.goarch == 'amd64'
      run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

    - name: Compile tests and run security gates
      if: matrix.goarch == 'amd64'
      run: ./build/verify.sh security

    - name: Build complete community package
      run: |
        python3 ../EdgeCommon/build/package-workspace.py \
          --workspace "$GITHUB_WORKSPACE" \
          --output "$RUNNER_TEMP/edge-artifacts" \
          --component api --arch ${{ matrix.goarch }} --node-arches amd64,arm64

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: edge-api-linux-${{ matrix.goarch }}
        path: ${{ runner.temp }}/edge-artifacts/*

  release:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
